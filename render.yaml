# Single-instance Node service. All data lives in Neon Postgres (DATABASE_URL), so no
# persistent disk is needed and accounts/tests/complaints survive deploys and restarts.
services:
  - type: web
    name: campus-wifi-monitor
    runtime: node
    plan: starter
    region: singapore
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: 22.23.3
      # Neon pooled connection string. Set the value in the Render dashboard (never commit it).
      - key: DATABASE_URL
        sync: false
      - key: TRUST_PROXY_HOPS
        value: 1
      # One instance behind Render's proxy, so SSE and the in-process scheduler work normally.
      - key: JWT_SECRET
        generateValue: true